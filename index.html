<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAPlayzzz Official Portal</title>
    
    <!-- Progressive Web App Meta tags & Splash integrations -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ea580c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="GAPlayzzz" />
    <link rel="apple-touch-icon" href="/icon-512.jpg" />
    
    <!-- Favicon static references -->
    <link rel="icon" type="image/jpeg" href="/icon-512.jpg" />
  </head>
  <body class="bg-zinc-950 text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Inline high-reliability service-worker registration code -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then((reg) => {
              console.log("Service Worker successfully registered with scope:", reg.scope);
            })
            .catch((err) => {
              console.warn("Service Worker registration failed:", err);
            });
        });
      }
    </script>
  </body>
</html>
